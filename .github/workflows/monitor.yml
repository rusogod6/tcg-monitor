name: TCG monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: tcg-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: tcg-state-${{ github.run_id }}
          restore-keys: tcg-state-

      - name: Run one cycle
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tcg_monitor.py --once

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: tcg-state-${{ github.run_id }}
